name: Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'web/**'
      - 'server/src/**'
      - '.github/workflows/deploy-cloudflare.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'server/src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker
      - name: Build web assets
        run: npm run build
        working-directory: web
      - name: Typecheck Worker
        run: npm run typecheck
        working-directory: worker
      - name: Test Worker (workerd, offline)
        run: npm test
        working-directory: worker
      - name: Dry-run bundle
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: worker

  # Deploys only once you opt in: set repository variable CLOUDFLARE_DEPLOY=true and add the
  # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets (see docs/cloudflare-workers.md).
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: worker
      - run: npm run build
        working-directory: web
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        working-directory: worker
      - name: Deploy Worker and assets
        run: npx wrangler deploy
        working-directory: worker
